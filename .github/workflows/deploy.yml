# main に push すると、テストを実行してから GitHub Pages に公開する。
# Supabase の接続先はリポジトリの Settings → Secrets and variables → Actions → Variables に
#   SUPABASE_URL / SUPABASE_ANON_KEY
# を登録しておく（未登録ならデモモードで公開される）。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 接続先を書き込む
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html config.js css js vendor _site/
          node -e '
            const fs = require("fs");
            const cfg = { supabaseUrl: process.env.SUPABASE_URL || "", supabaseAnonKey: process.env.SUPABASE_ANON_KEY || "" };
            fs.writeFileSync("_site/config.js", "window.GOLF_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n");
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
